<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e6b58" />
    <meta
      name="description"
      content="KillQuestion：本地优先的题库刷题应用。重点刷题 + 大范围刷题，离线可用，数据只存在本机。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>KillQuestion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        var hadController = !!navigator.serviceWorker.controller;
        var refreshed = false;
        // 新版本接管时自动刷新一次（仅当本来就由旧 SW 控制，避免首次安装白刷）
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController || refreshed) return;
          refreshed = true;
          window.location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker
            // updateViaCache: 'none' —— GitHub Pages 会给 sw.js 十分钟缓存，不绕过去的话新版本要等很久
            .register('./sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              reg.update().catch(function () {});
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
